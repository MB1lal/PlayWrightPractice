# Shipped defaults. Copy any key into src/test/resources/config.properties
# to override it for test runs. System properties (-Dkey=value) and the
# BROWSER / HEADLESS / BASE_URL environment variables always win.

base.url = https://duckduckgo.com
heroku.url = https://the-internet.herokuapp.com
browser = chromium
headless = true
slow.mo.ms = 0
timeout.ms = 30000
viewport.width = 1920
viewport.height = 1080
testdata.dir = src/test/resources/data-files
screenshot.dir = target/screenshots
