# Playwright UI Testing Framework Configuration

# Browser Configuration
browser=chrome
headless=true
slowmo=0
timeout=30000

# Base URL Configuration
base.url=https://petstore.swagger.io
base.uri=https://petstore.swagger.io/v2

# Wait Configuration (milliseconds)
implicit.wait=10000
explicit.wait=15000
page.load.timeout=30000

# Screenshot Configuration
screenshot.on.failure=true
screenshot.directory=screenshots

# Log Configuration
log.level=INFO
log.dir=logs

# Test Data Configuration
test.data.dir=src/test/resources/testdata
test.report.dir=target/test-reports

# Parallel Execution
parallel.threads=8
parallel.enabled=true

# Retry Configuration
max.retries=2
retry.delay=1000

# Browser Launch Options
chrome.args=--disable-blink-features=AutomationControlled,--window-size=1920,1080
firefox.args=--width=1920,--height=1080
webkit.args=

# Network Configuration
network.timeout=30000
ignore.https.errors=true

# Video Recording (optional)
record.video=false
video.dir=videos

# Trace Recording (optional)
record.trace=false
trace.dir=traces
