# Test-run configuration. Every key can be overridden from the CLI, e.g.
#   mvn test -Dbrowser=firefox -Dheadless=false
# See ConfigManager for the full resolution order.

base.url = https://duckduckgo.com
heroku.url = https://the-internet.herokuapp.com
browser = chromium
headless = true
slow.mo.ms = 0
timeout.ms = 30000
viewport.width = 1920
viewport.height = 1080
testdata.dir = src/test/resources/data-files
screenshot.dir = target/screenshots
