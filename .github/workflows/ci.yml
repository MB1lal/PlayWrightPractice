name: ci

on:
  push:
    branches: [master, improvement]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install Playwright browsers with OS deps
        run: |
          mvn -f java/pom.xml -q compile dependency:build-classpath -Dmdep.outputFile=/tmp/cp.txt
          sudo java -cp "java/target/classes:$(cat /tmp/cp.txt)" \
            com.microsoft.playwright.CLI install --with-deps chromium
      - name: Run Java suite
        run: mvn -f java/pom.xml test -Dbrowser=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: java-failure-screenshots
          path: java/target/screenshots/

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ts-test-results
          path: |
            typescript/test-results/
            typescript/playwright-report/
